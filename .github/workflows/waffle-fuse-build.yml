name: Build waffle-fuse

on:
  push:
    tags:
      - 'waffle-fuse-v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on Debian 11 (glibc 2.31)
    # GitHub-hosted runner, build inside a Debian 11 container: the binary links
    # against glibc 2.31 and runs on Debian 11 and every newer distribution.
    runs-on: ubuntu-latest
    container: debian:11

    env:
      DEBIAN_FRONTEND: noninteractive
      # Highest glibc symbol version the binary may require (Debian 11)
      MAX_GLIBC: '2.31'

    steps:
      - name: Install dependencies
        # Debian 11 is end of life: its packages moved to archive.debian.org
        # (the debian-security pool on deb.debian.org answers 404)
        run: |
          find /etc/apt -name '*.list' -o -name '*.sources' | \
            xargs sed -i 's|http://deb.debian.org|http://archive.debian.org|g'
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libfuse3-dev \
            git \
            ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build waffle-fuse
        working-directory: waffle-fuse
        # Only glibc stays dynamic. libfuse3 is linked statically because its
        # soname changed (libfuse3.so.3 on Debian 11, libfuse3.so.4 from fuse
        # 3.17 on): mounting goes through fusermount3 and /dev/fuse, both stable.
        # libstdc++/libgcc are static too: no dependency on the compiler runtime.
        run: |
          make -j"$(nproc)" \
            FUSE_LIBS="-Wl,-Bstatic -lfuse3 -Wl,-Bdynamic -ldl" \
            EXTRA_LDFLAGS="-static-libstdc++ -static-libgcc"

      - name: Check binary compatibility
        working-directory: waffle-fuse
        run: |
          echo "--- Shared libraries needed:"
          objdump -p waffle-fuse | grep NEEDED
          if objdump -p waffle-fuse | grep -E 'NEEDED.*(libfuse|libstdc\+\+|libgcc_s)'; then
            echo "::error::libfuse3, libstdc++ and libgcc must be linked statically"
            exit 1
          fi
          NEED=$(objdump -T waffle-fuse | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "--- Highest glibc version required: $NEED (max allowed: $MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$NEED" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::waffle-fuse requires glibc $NEED, newer than $MAX_GLIBC"
            exit 1
          fi
          ./waffle-fuse --help | head -3

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: waffle-fuse-linux-x86_64
          path: waffle-fuse/waffle-fuse
          if-no-files-found: error
