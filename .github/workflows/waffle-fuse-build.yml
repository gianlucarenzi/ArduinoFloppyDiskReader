name: Build waffle-fuse

on:
  push:
    tags:
      - 'waffle-fuse-v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on Debian 11 (glibc 2.31)
    # GitHub-hosted runner, build inside a Debian 11 container: the binary links
    # against glibc 2.31 and runs on Debian 11 and every newer distribution.
    runs-on: ubuntu-latest
    container: debian:11

    env:
      DEBIAN_FRONTEND: noninteractive
      # Highest glibc symbol version the binary may require (Debian 11)
      MAX_GLIBC: '2.31'

    steps:
      - name: Install dependencies
        # Debian 11 is end of life: its packages moved to archive.debian.org
        # (the debian-security pool on deb.debian.org answers 404)
        run: |
          find /etc/apt -name '*.list' -o -name '*.sources' | \
            xargs sed -i 's|http://deb.debian.org|http://archive.debian.org|g'
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libfuse3-dev \
            git \
            ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build waffle-fuse
        working-directory: waffle-fuse
        # Only glibc stays dynamic. libfuse3 is linked statically because its
        # soname changed (libfuse3.so.3 on Debian 11, libfuse3.so.4 from fuse
        # 3.17 on): mounting goes through fusermount3 and /dev/fuse, both stable.
        # libstdc++/libgcc are static too: no dependency on the compiler runtime.
        run: |
          make -j"$(nproc)" \
            FUSE_LIBS="-Wl,-Bstatic -lfuse3 -Wl,-Bdynamic -ldl" \
            EXTRA_LDFLAGS="-static-libstdc++ -static-libgcc"

      - name: Check binary compatibility
        working-directory: waffle-fuse
        run: |
          echo "--- Shared libraries needed:"
          objdump -p waffle-fuse | grep NEEDED
          if objdump -p waffle-fuse | grep -E 'NEEDED.*(libfuse|libstdc\+\+|libgcc_s)'; then
            echo "::error::libfuse3, libstdc++ and libgcc must be linked statically"
            exit 1
          fi
          NEED=$(objdump -T waffle-fuse | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "--- Highest glibc version required: $NEED (max allowed: $MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$NEED" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::waffle-fuse requires glibc $NEED, newer than $MAX_GLIBC"
            exit 1
          fi
          ./waffle-fuse --help | head -3

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: waffle-fuse-linux-x86_64
          path: waffle-fuse/waffle-fuse
          if-no-files-found: error

  package:
    name: Packages (deb, rpm, Arch, generic)
    needs: build
    runs-on: ubuntu-latest

    env:
      NFPM_VERSION: '2.47.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: waffle-fuse-linux-x86_64
          path: bin

      - name: Package version
        # Release tag waffle-fuse-vX.Y.Z -> X.Y.Z; manual runs -> 0.0.0.dev<run number>
        run: |
          case "$GITHUB_REF" in
            refs/tags/waffle-fuse-v*) VERSION="${GITHUB_REF_NAME#waffle-fuse-v}" ;;
            *) VERSION="0.0.0.dev${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Package version: $VERSION"

      - name: Install nFPM
        run: |
          cd "$RUNNER_TEMP"
          TARBALL="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -sSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$TARBALL"
          curl -sSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt"
          grep " $TARBALL\$" checksums.txt | sha256sum -c -
          tar xzf "$TARBALL" nfpm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build packages
        working-directory: waffle-fuse
        run: |
          chmod +x ../bin/waffle-fuse      # artifacts lose the executable bit
          sh packaging/stage.sh ../bin/waffle-fuse stage/waffle-fuse
          mkdir -p dist
          for p in deb rpm archlinux; do
            nfpm package -f packaging/nfpm.yaml -p "$p" -t dist/
          done
          # Generic archive for the other distributions: install.sh copies to /opt
          GENERIC="waffle-fuse-${VERSION}-linux-x86_64"
          mkdir -p "generic/$GENERIC"
          cp -R stage/waffle-fuse "generic/$GENERIC/"
          install -m 755 packaging/install.sh "generic/$GENERIC/"
          install -m 644 packaging/waffle-installer.desktop "generic/$GENERIC/"
          tar -C generic --owner=0 --group=0 -czf "dist/$GENERIC.tar.gz" "$GENERIC"
          ls -l dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: waffle-fuse-packages
          path: waffle-fuse/dist/*
          if-no-files-found: error

  test-install:
    name: Install on ${{ matrix.name }}
    needs: package
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 11
            image: debian:11
            # end of life: packages on archive.debian.org
            install: |
              find /etc/apt -name '*.list' -o -name '*.sources' | xargs sed -i 's|http://deb.debian.org|http://archive.debian.org|g'
              apt-get -o Acquire::Check-Valid-Until=false update
              apt-get install -y ./pkgs/*.deb
            remove: apt-get remove -y waffle-fuse
          - name: Debian 13
            image: debian:13
            install: apt-get update && apt-get install -y ./pkgs/*.deb
            remove: apt-get remove -y waffle-fuse
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./pkgs/*.deb
            remove: apt-get remove -y waffle-fuse
          - name: Fedora
            image: fedora:latest
            install: dnf install -y ./pkgs/*.rpm
            remove: dnf remove -y waffle-fuse
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./pkgs/*.rpm
            remove: zypper --non-interactive remove waffle-fuse
          - name: Arch Linux
            image: archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm ./pkgs/*.pkg.tar.zst
            remove: pacman -R --noconfirm waffle-fuse
          - name: generic archive (Debian 13)
            image: debian:13
            install: |
              apt-get update && apt-get install -y python3 python3-gi gir1.2-gtk-3.0 fuse3 acl
              mkdir generic && tar -C generic -xzf pkgs/*.tar.gz
              sh generic/*/install.sh
              rm -rf generic
            remove: sh /opt/waffle-fuse/install.sh --uninstall

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: waffle-fuse-packages
          path: pkgs

      - name: Install
        run: ${{ matrix.install }}

      - name: Check installation
        run: |
          waffle-fuse --help | head -3
          test -x /opt/waffle-fuse/scripts/waffle-installer.py
          command -v waffle-installer
          python3 -c "import gi; gi.require_version('Gtk', '3.0')"
          command -v fusermount3

      - name: Remove
        run: ${{ matrix.remove }}

      - name: Check removal
        run: |
          if [ -e /opt/waffle-fuse ] || command -v waffle-fuse; then
            echo "::error::waffle-fuse still installed"
            exit 1
          fi

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/waffle-fuse-v')
    needs: [package, test-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: waffle-fuse-packages
          path: pkgs

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: pkgs/*
          generate_release_notes: true
